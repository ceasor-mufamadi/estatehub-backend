syntax = "proto3";

option csharp_namespace = "EstateHub.Api";
package estatehub.estate.v1;

// Structure inside the caller's active estate: details, blocks, units. Staff (and guards, for unit
// numbers) only: residents see just their own units, through other RPCs. Every call is scoped to the
// token's estate. Quotas and sizes are decimal strings ("2.3456"), never floating point.

message BlockEntry {
  string id = 1;
  string name = 2;
}

message CreateBlockRequest {
  string name = 1;
}

message ListBlocksRequest {}

message ListBlocksResponse {
  repeated BlockEntry items = 1;
}

message RenameBlockRequest {
  string block_id = 1;
  string name = 2;
}

message DeleteBlockRequest {
  string block_id = 1;
}

message DeleteBlockResponse {}

message UnitEntry {
  string id = 1;
  int32 section_number = 2;
  string door_number = 3;
  // Empty when the unit isn't in a block.
  string block_id = 4;
  string block_name = 5;
  // Percentage, up to 4 decimals, e.g. "2.3456".
  string participation_quota = 6;
  // Square metres, e.g. "84.50"; empty when unknown.
  string size_square_metres = 7;
}

message ListUnitsRequest {}

message ListUnitsResponse {
  repeated UnitEntry items = 1;
  // Sum of all quotas, e.g. "98.7500".
  string quota_total = 2;
  // True when the quotas add up to exactly 100 (billing needs this).
  bool quota_complete = 3;
}

message UnitInput {
  int32 section_number = 1;
  string door_number = 2;
  string block_id = 3;
  string participation_quota = 4;
  string size_square_metres = 5;
}

message CreateUnitRequest {
  UnitInput unit = 1;
}

message UpdateUnitRequest {
  string unit_id = 1;
  UnitInput unit = 2;
}

message DeleteUnitRequest {
  string unit_id = 1;
}

message DeleteUnitResponse {}

message GetEstateDetailsRequest {}

message EstateDetails {
  string id = 1;
  string name = 2;
  string scheme_type = 3;
  // e.g. "SS 123/2005".
  string scheme_number = 4;
  string csos_registration_number = 5;
  string address = 6;
}

message UpdateEstateDetailsRequest {
  string name = 1;
  string scheme_number = 2;
  string csos_registration_number = 3;
  string address = 4;
}

// POPIA settings (slice 3.4).
message GetPrivacySettingsRequest {}

message PrivacySettings {
  // Named in the residents' privacy notice.
  string information_officer_name = 1;
  string information_officer_email = 2;
  // Record visitors' ID numbers at the gate (Sprint 6): off by default; encrypted and masked when on.
  bool visitor_id_capture = 3;
  // How long visitor records are kept: 30–365 days (default 90).
  int32 visitor_retention_days = 4;
}

message UpdatePrivacySettingsRequest {
  PrivacySettings settings = 1;
}

service EstateService {
  rpc GetEstateDetails(GetEstateDetailsRequest) returns (EstateDetails);
  rpc UpdateEstateDetails(UpdateEstateDetailsRequest) returns (EstateDetails);
  rpc GetPrivacySettings(GetPrivacySettingsRequest) returns (PrivacySettings);
  // Needs a recent MFA (turning on ID numbers is a privacy decision).
  rpc UpdatePrivacySettings(UpdatePrivacySettingsRequest) returns (PrivacySettings);
  rpc CreateBlock(CreateBlockRequest) returns (BlockEntry);
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);
  rpc RenameBlock(RenameBlockRequest) returns (BlockEntry);
  // Only an empty block (no units) can be removed.
  rpc DeleteBlock(DeleteBlockRequest) returns (DeleteBlockResponse);
  rpc ListUnits(ListUnitsRequest) returns (ListUnitsResponse);
  rpc CreateUnit(CreateUnitRequest) returns (UnitEntry);
  rpc UpdateUnit(UpdateUnitRequest) returns (UnitEntry);
  rpc DeleteUnit(DeleteUnitRequest) returns (DeleteUnitResponse);
}

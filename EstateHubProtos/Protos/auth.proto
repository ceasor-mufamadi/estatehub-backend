syntax = "proto3";

option csharp_namespace = "EstateHub.Api";
package estatehub.auth.v1;

import "google/protobuf/timestamp.proto";

// Sign-in and sessions (PHASE1.md §2a). Browsers never see a refresh token: the API sets it as an
// HttpOnly cookie scoped to this service's path (AUTH-10), and Refresh/Logout read it from there.
//
// Staff sign-in:  PasswordSignIn → mfa step → VerifyMfa                  → SignedIn
// First time:     PasswordSignIn → mfa step (enrolment_required)
//                   → BeginTotpEnrolment (scan QR) → ConfirmTotpEnrolment → SignedIn + recovery codes
// Resident:       RequestOtp (email or SA mobile) → VerifyOtp → SignedIn (or an mfa step for staff)
// Invitation:     GetInvitation (link) → StartInvitation (code to the invited address)
//                   → AcceptInvitation (code [+ new password for staff]) → SignedIn or mfa step
// Passkey:        BeginPasskeySignIn → navigator.credentials.get(options) → FinishPasskeySignIn → SignedIn
// Page load:      Refresh (cookie) → SignedIn, or UNAUTHENTICATED when there is no live session
//
// Human check (AUTH-05): after repeated failures from an IP address, PasswordSignIn, RequestOtp,
// RequestPasswordReset and StartInvitation answer FAILED_PRECONDITION with the trailer
// "estatehub-challenge: turnstile". Show Cloudflare Turnstile and repeat the call with its token in
// the "x-human-check" header.

message PasswordSignInRequest {
  string email = 1;
  string password = 2;
}

message PasswordSignInResponse {
  oneof step {
    // Done: no second factor needed (non-staff without MFA).
    SignedIn signed_in = 1;
    // Password accepted; finish with VerifyMfa, or set up MFA first when enrolment_required.
    MfaStep mfa = 2;
  }
}

message MfaStep {
  // Proves the password step for 5 minutes. Send it with the next call.
  string challenge_token = 1;
  // True: this account must set up an authenticator app before signing in (staff, first time).
  bool enrolment_required = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// A new access token (15 min, memory only) and what it allows.
message SignedIn {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
  string user_id = 3;
  // Empty = platform level (super admin, or choose an estate with SwitchEstate).
  string estate_id = 4;
  // Empty when not acting in any estate.
  string role = 5;
  repeated string permissions = 6;
  // Only right after setting up MFA. Show once; they are never shown again.
  repeated string recovery_codes = 7;
  string email = 8;
  // Set during support access (role "support"): when the read-only access ends by itself.
  google.protobuf.Timestamp support_ends_at = 9;
}

message VerifyMfaRequest {
  string challenge_token = 1;
  // The 6-digit authenticator code, or one recovery code.
  string code = 2;
}

message BeginTotpEnrolmentRequest {
  string challenge_token = 1;
}

message BeginTotpEnrolmentResponse {
  // Base32 key, for typing into the app when scanning isn't possible.
  string secret = 1;
  string otpauth_uri = 2;
  // The otpauth URI as a QR code image (data:image/png;base64,…).
  string qr_code_data_url = 3;
}

message ConfirmTotpEnrolmentRequest {
  string challenge_token = 1;
  // The first 6-digit code the app shows, proving it was set up correctly.
  string code = 2;
}

message RefreshRequest {}

message StepUpRequest {
  // Authenticator code (or recovery code). Gives the session a fresh MFA time for sensitive actions.
  string code = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message LogoutAllRequest {}

message LogoutAllResponse {}

message ListMyEstatesRequest {}

message ListMyEstatesResponse {
  repeated MyEstate items = 1;
  // Super admin: may switch back to platform administration (SwitchEstate with an empty estate_id).
  bool platform_access = 2;
}

message MyEstate {
  string estate_id = 1;
  string estate_name = 2;
  string role = 3;
}

message SwitchEstateRequest {
  // Empty = back to platform level.
  string estate_id = 1;
}

message DevSignInRequest {
  // Short label for a throwaway account (becomes <label>@dev.estatehub.local).
  string user_id = 1;
  // Estate to sign in to. Ignored for super_admin.
  string estate_id = 2;
  // One of the role keys in RolePermissions (e.g. "manager", "owner", "super_admin").
  string role = 3;
  // True: MFA just now. False: MFA over 15 minutes ago, so step-up actions ask again.
  bool mfa = 4;
}

message RequestOtpRequest {
  // Email address or South African mobile number (082 123 4567 / +27 82 123 4567).
  string identifier = 1;
}

// Always the same shape, whether or not an account exists (AUTH-07).
message OtpStep {
  string challenge_token = 1;
  // "email" or "sms".
  string channel = 2;
  // Masked: "c****r@gmail.com", "+27 ** *** 4567".
  string destination = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message VerifyOtpRequest {
  string challenge_token = 1;
  string code = 2;
}

// The next step after a code: signed in, or (staff) an MFA step.
message SignInStepResponse {
  oneof step {
    SignedIn signed_in = 1;
    MfaStep mfa = 2;
  }
}

message GetInvitationRequest {
  // The token from the invitation link (the part after #).
  string invitation_token = 1;
}

message GetInvitationResponse {
  string estate_name = 1;
  string role = 2;
  // Who was invited, as the inviter typed it.
  string name = 3;
  // Where the code will go: "email" or "sms", and the masked address.
  string channel = 4;
  string destination = 5;
  // Staff joining without a password yet must choose one when accepting.
  bool password_required = 6;
  google.protobuf.Timestamp expires_at = 7;
}

message StartInvitationRequest {
  string invitation_token = 1;
}

message AcceptInvitationRequest {
  // From StartInvitation.
  string challenge_token = 1;
  string code = 2;
  // Only when GetInvitation said password_required.
  string new_password = 3;
}

message ListSessionsRequest {}

message SessionEntry {
  string id = 1;
  // "Chrome on macOS".
  string device = 2;
  string ip_address = 3;
  google.protobuf.Timestamp signed_in_at = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  // This browser.
  bool current = 6;
}

message ListSessionsResponse {
  repeated SessionEntry items = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message SignOutOtherSessionsRequest {}

message SignOutOtherSessionsResponse {
  int32 signed_out = 1;
}

message ChangePasswordRequest {
  // Empty only for accounts that never had a password (residents who sign in with codes).
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message RequestPasswordResetRequest {
  // Email address or SA mobile number.
  string identifier = 1;
}

message ResetPasswordRequest {
  string challenge_token = 1;
  string code = 2;
  string new_password = 3;
}

message RegenerateRecoveryCodesRequest {}

message RegenerateRecoveryCodesResponse {
  // Shown once; the previous codes stop working.
  repeated string recovery_codes = 1;
}

message StartSupportAccessRequest {
  string estate_id = 1;
  // Why you need access. Shown to the estate in its activity log (at least 10 characters).
  string reason = 2;
}

message EndSupportAccessRequest {}

message SetGuardPinRequest {
  // Exactly 6 digits; not repeated or consecutive digits.
  string pin = 1;
}

message SetGuardPinResponse {}

message BeginPasskeyRegistrationRequest {}

// Also BeginPasskeySignIn's response.
message PasskeyOptions {
  // Send back with the finish call.
  string challenge_token = 1;
  // PublicKeyCredential{Creation,Request}OptionsJSON for the browser.
  string options_json = 2;
}

message FinishPasskeyRegistrationRequest {
  string challenge_token = 1;
  // The credential's toJSON() from navigator.credentials.create().
  string credential_json = 2;
  // e.g. "MacBook Touch ID".
  string name = 3;
}

message FinishPasskeyRegistrationResponse {}

message BeginPasskeySignInRequest {}

message FinishPasskeySignInRequest {
  string challenge_token = 1;
  // The credential's toJSON() from navigator.credentials.get().
  string credential_json = 2;
}

message ListPasskeysRequest {}

message PasskeyEntry {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp added_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

message ListPasskeysResponse {
  repeated PasskeyEntry items = 1;
}

message RemovePasskeyRequest {
  string passkey_id = 1;
}

message RemovePasskeyResponse {}

message GetSignInReportRequest {
  // From the "This wasn't me" link in a new sign-in email (the part after #).
  string report_token = 1;
}

message GetSignInReportResponse {
  // "Chrome on Android".
  string device = 1;
  string ip_address = 2;
  google.protobuf.Timestamp signed_in_at = 3;
  // The account had a password, which securing it cancels.
  bool had_password = 4;
}

message SecureAccountRequest {
  string report_token = 1;
}

message SecureAccountResponse {}

message GetJwksRequest {}

message GetJwksResponse {
  // JSON Web Key Set with the public keys tokens are signed with (RFC 7517).
  string jwks_json = 1;
}

service AuthService {
  rpc PasswordSignIn(PasswordSignInRequest) returns (PasswordSignInResponse);
  rpc RequestOtp(RequestOtpRequest) returns (OtpStep);
  rpc VerifyOtp(VerifyOtpRequest) returns (SignInStepResponse);
  // NOT_FOUND when the link was used, revoked or has expired.
  rpc GetInvitation(GetInvitationRequest) returns (GetInvitationResponse);
  rpc StartInvitation(StartInvitationRequest) returns (OtpStep);
  rpc AcceptInvitation(AcceptInvitationRequest) returns (SignInStepResponse);
  rpc VerifyMfa(VerifyMfaRequest) returns (SignedIn);
  rpc BeginTotpEnrolment(BeginTotpEnrolmentRequest) returns (BeginTotpEnrolmentResponse);
  rpc ConfirmTotpEnrolment(ConfirmTotpEnrolmentRequest) returns (SignedIn);
  // Uses the refresh cookie; rotates it.
  rpc Refresh(RefreshRequest) returns (SignedIn);
  // Signed in: re-confirm MFA before a sensitive action (the "estatehub-step-up" trailer asks for it).
  rpc StepUp(StepUpRequest) returns (SignedIn);
  // Ends this browser's session (refresh cookie) and clears the cookie.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Signed in: ends every session of the caller, on every device.
  rpc LogoutAll(LogoutAllRequest) returns (LogoutAllResponse);
  rpc ListMyEstates(ListMyEstatesRequest) returns (ListMyEstatesResponse);
  // Account security: the caller's own devices, password and recovery codes.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc SignOutOtherSessions(SignOutOtherSessionsRequest) returns (SignOutOtherSessionsResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Forgot password: a code to the address, then ResetPassword. Same answer for unknown addresses.
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (OtpStep);
  rpc ResetPassword(ResetPasswordRequest) returns (SignInStepResponse);
  // Needs MFA within 15 minutes.
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse);
  rpc SwitchEstate(SwitchEstateRequest) returns (SignedIn);
  // Passkeys (AUTH-03): adding one needs MFA within 15 minutes; signing in with one counts as MFA.
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (PasskeyOptions);
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse);
  rpc BeginPasskeySignIn(BeginPasskeySignInRequest) returns (PasskeyOptions);
  rpc FinishPasskeySignIn(FinishPasskeySignInRequest) returns (SignedIn);
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);
  rpc RemovePasskey(RemovePasskeyRequest) returns (RemovePasskeyResponse);
  // "This wasn't me" from a new sign-in email: what it was, then secure the account (every device
  // signed out, password cancelled, operator alerted). NOT_FOUND for a used or expired link.
  rpc GetSignInReport(GetSignInReportRequest) returns (GetSignInReportResponse);
  rpc SecureAccount(SecureAccountRequest) returns (SecureAccountResponse);
  // Super admin: read-only support access to one estate for 30 minutes (AUTH-13). Needs MFA within 15 minutes.
  rpc StartSupportAccess(StartSupportAccessRequest) returns (SignedIn);
  rpc EndSupportAccess(EndSupportAccessRequest) returns (SignedIn);
  // A guard's PIN for this estate's tablets (AUTH-14).
  rpc SetGuardPin(SetGuardPinRequest) returns (SetGuardPinResponse);
  // Disabled (UNIMPLEMENTED) outside the Development and Testing environments.
  rpc DevSignIn(DevSignInRequest) returns (SignedIn);
  rpc GetJwks(GetJwksRequest) returns (GetJwksResponse);
}

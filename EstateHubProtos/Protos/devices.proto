syntax = "proto3";

option csharp_namespace = "EstateHub.Api";
package estatehub.devices.v1;

import "google/protobuf/timestamp.proto";
import "Protos/auth.proto";

// Guard tablets (AUTH-14). Managers pair a tablet with a one-time code; the tablet then keeps its own
// credential in an HttpOnly cookie (scoped to this service's path). Guards sign in on it with a PIN.
//
// Manager:  CreatePairingCode → code shown once (15 min) · ListDevices · RevokeDevice
// Tablet:   PairDevice(code) → cookie · GetTablet → guards · GuardSignIn(guard, PIN) → session

message CreatePairingCodeRequest {
  // A name for the tablet, e.g. "Main gate".
  string label = 1;
}

message PairingCodeResponse {
  // "XXXX-XXXX". Shown once; works once, for 15 minutes.
  string code = 1;
  string label = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ListDevicesRequest {}

message GuardDeviceEntry {
  string id = 1;
  string label = 2;
  google.protobuf.Timestamp paired_at = 3;
  google.protobuf.Timestamp last_seen_at = 4;
}

message ListDevicesResponse {
  repeated GuardDeviceEntry items = 1;
}

message RevokeDeviceRequest {
  string device_id = 1;
}

message RevokeDeviceResponse {}

message PairDeviceRequest {
  string code = 1;
}

message PairDeviceResponse {
  string estate_name = 1;
  string label = 2;
}

message GetTabletRequest {}

message TabletGuard {
  string user_id = 1;
  string name = 2;
  // False: the guard must set a PIN on their phone first (Account).
  bool has_pin = 3;
}

message GetTabletResponse {
  string estate_name = 1;
  string label = 2;
  repeated TabletGuard guards = 3;
}

message GuardSignInRequest {
  string user_id = 1;
  string pin = 2;
}

service GuardDeviceService {
  rpc CreatePairingCode(CreatePairingCodeRequest) returns (PairingCodeResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // Signs out every guard on it, at once.
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // On the tablet. UNAUTHENTICATED for an unknown, used or expired code.
  rpc PairDevice(PairDeviceRequest) returns (PairDeviceResponse);
  // On the tablet (its cookie). UNAUTHENTICATED when the tablet was revoked.
  rpc GetTablet(GetTabletRequest) returns (GetTabletResponse);
  rpc GuardSignIn(GuardSignInRequest) returns (estatehub.auth.v1.SignedIn);
}
